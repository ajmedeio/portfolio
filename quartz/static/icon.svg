<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Edges connecting the nodes -->
  <line x1="16" y1="10" x2="8" y2="20" stroke="#7b97aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="10" x2="24" y2="18" stroke="#7b97aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="10" x2="20" y2="26" stroke="#7b97aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="20" x2="20" y2="26" stroke="#7b97aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="18" x2="20" y2="26" stroke="#7b97aa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Central/top node (primary, largest) -->
  <circle cx="16" cy="10" r="4" fill="#284b63"/>
  <!-- Left node -->
  <circle cx="8" cy="20" r="3" fill="#84a59d"/>
  <!-- Right node -->
  <circle cx="24" cy="18" r="3" fill="#84a59d"/>
  <!-- Bottom node -->
  <circle cx="20" cy="26" r="2.5" fill="#284b63"/>
</svg>